<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gym ABC</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button {
      font: inherit;
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
    }

    #homeScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      z-index: 10;
    }

    #homeScreen.hidden {
      display: none;
    }

    .home-inner {
      width: min(100%, 380px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .home-title {
      margin: 0 0 10px;
      color: #888;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
    }

    .day-button {
      width: 100%;
      height: 82px;
      border: 1px solid #222;
      background: #000;
      color: #fff;
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
    }

    .day-button:active {
      background: #fff;
      color: #000;
    }

    .home-note {
      margin: 10px 0 0;
      color: #777;
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
    }

    #workoutScreen {
      display: none;
      z-index: 20;
    }

    #workoutScreen.active {
      display: block;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-bottom: 1px solid #222;
      z-index: 3;
      padding-top: env(safe-area-inset-top);
      box-sizing: content-box;
    }

    .home-button {
      position: absolute;
      left: 8px;
      top: calc(50% + env(safe-area-inset-top) / 2);
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 23px;
      font-weight: 900;
    }

    .mode-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid #222;
      border-radius: 999px;
      background: #000;
    }

    .mode-button {
      height: 34px;
      min-width: 82px;
      padding: 0 13px;
      border-radius: 999px;
      color: #888;
      font-size: 12px;
      font-weight: 900;
    }

    .mode-button.active {
      background: #fff;
      color: #000;
    }

    .day-mark {
      position: absolute;
      right: 14px;
      top: calc(50% + env(safe-area-inset-top) / 2);
      transform: translateY(-50%);
      color: #888;
      font-size: 14px;
      font-weight: 900;
    }

    #grid {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(56px + env(safe-area-inset-top));
      bottom: env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: 0;
      background: #000;
      overflow: hidden;
    }

    .exercise {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .exercise img,
    .placeholder {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .placeholder {
      display: grid;
      place-items: center;
      border: 1px solid #111;
      color: #444;
      font-size: 34px;
      font-weight: 900;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 12px 16px;
      background: rgba(0, 0, 0, 0.68);
      z-index: 2;
    }

    .name {
      display: block;
      font-size: clamp(22px, 6.5vw, 36px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .meta {
      display: block;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(18px, 5.2vw, 30px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    #modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.92);
      z-index: 50;
    }

    #modal.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 430px);
    }

    #modalMedia {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #000;
    }

    #modalMedia img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-info {
      padding: 14px 2px 0;
    }

    .modal-info h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.04em;
    }

    .modal-info p {
      margin: 6px 0 0;
      color: #888;
      font-size: 14px;
      line-height: 1.4;
    }

    .close {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      z-index: 60;
    }

    @media (min-width: 560px) {
      #app {
        left: 50%;
        width: 430px;
        transform: translateX(-50%);
        border-left: 1px solid #222;
        border-right: 1px solid #222;
      }

      .screen {
        left: 50%;
        width: 430px;
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <section id="homeScreen" class="screen">
      <div class="home-inner">
        <p class="home-title">Choose day</p>
        <button class="day-button" type="button" data-day="0">A</button>
        <button class="day-button" type="button" data-day="1">B</button>
        <button class="day-button" type="button" data-day="2">C</button>
        <p class="home-note">Edit workouts.txt on GitHub to change names, sets and reps.</p>
      </div>
    </section>

    <section id="workoutScreen" class="screen">
      <header class="topbar">
        <button class="home-button" id="homeButton" type="button" aria-label="Home">⌂</button>
        <div class="mode-switcher">
          <button class="mode-button active" type="button" data-mode="workout">Gym</button>
          <button class="mode-button" type="button" data-mode="posture">Posture</button>
        </div>
        <div class="day-mark" id="dayMark">A</div>
      </header>

      <section id="grid"></section>
    </section>
  </main>

  <div id="modal">
    <button class="close" id="closeModal" type="button">×</button>
    <div class="modal-card">
      <div id="modalMedia"></div>
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p id="modalMeta"></p>
      </div>
    </div>
  </div>

  <script>
    const EXTENSIONS = ["jpg", "png", "gif", "jpeg", "JPG", "PNG", "GIF", "JPEG"];

    const WORKOUTS = [
      {
        title: "A",
        workout: [
          { name: "Goblet Squat", file: "images/a/aw1", sets: 3, reps: "10", notes: "Slow down, knees track toes" },
          { name: "Romanian Deadlift", file: "images/a/aw2", sets: 3, reps: "10", notes: "Hips back, neutral back" },
          { name: "Floor Press", file: "images/a/aw3", sets: 3, reps: "10", notes: "Elbows 45°" },
          { name: "Bent-over Row", file: "images/a/aw4", sets: 3, reps: "10", notes: "Pull to ribs" },
          { name: "Reverse Lunge", file: "images/a/aw5", sets: 3, reps: "8/side", notes: "Tall torso" },
          { name: "Shoulder Press", file: "images/a/aw6", sets: 3, reps: "10", notes: "Ribs down" },
          { name: "Glute Bridge", file: "images/a/aw7", sets: 3, reps: "12", notes: "Squeeze at top" },
          { name: "Plank Hold", file: "images/a/aw8", sets: 3, reps: "30s", notes: "Long neck, tight core" }
        ],
        posture: [
          { name: "Wall Angels", file: "images/a/ap1", sets: 2, reps: "10", notes: "Back against wall" },
          { name: "Chin Tucks", file: "images/a/ap2", sets: 2, reps: "10", notes: "Tiny double chin" },
          { name: "Thoracic Extension", file: "images/a/ap3", sets: 2, reps: "8", notes: "Upper back only" },
          { name: "Doorway Pec Stretch", file: "images/a/ap4", sets: 2, reps: "30s", notes: "Gentle chest opening" },
          { name: "Cat Cow", file: "images/a/ap5", sets: 2, reps: "8", notes: "Move one vertebra at a time" },
          { name: "Hip Flexor Stretch", file: "images/a/ap6", sets: 2, reps: "30s/side", notes: "Tuck pelvis slightly" },
          { name: "Dead Bug", file: "images/a/ap7", sets: 2, reps: "8/side", notes: "Lower back stays down" },
          { name: "Scapular Push-up", file: "images/a/ap8", sets: 2, reps: "10", notes: "Move shoulder blades" }
        ]
      },
      {
        title: "B",
        workout: [
          { name: "Push-up", file: "images/b/bw1", sets: 3, reps: "AMRAP", notes: "Clean reps only" },
          { name: "TRX Row", file: "images/b/bw2", sets: 3, reps: "10", notes: "Body straight" },
          { name: "Jump Squat", file: "images/b/bw3", sets: 3, reps: "8", notes: "Land quiet" },
          { name: "Renegade Row", file: "images/b/bw4", sets: 3, reps: "8/side", notes: "Hips steady" },
          { name: "Calf Raise", file: "images/b/bw5", sets: 3, reps: "15", notes: "Full range" },
          { name: "Lateral Raise", file: "images/b/bw6", sets: 3, reps: "12", notes: "Soft elbows" },
          { name: "Mountain Climber", file: "images/b/bw7", sets: 3, reps: "30s", notes: "Shoulders over wrists" },
          { name: "Burpee", file: "images/b/bw8", sets: 3, reps: "6", notes: "Controlled, not chaotic" }
        ],
        posture: [
          { name: "Band Pull-apart", file: "images/b/bp1", sets: 2, reps: "12", notes: "Shoulders down" },
          { name: "Face Pull", file: "images/b/bp2", sets: 2, reps: "12", notes: "Pull toward eyes" },
          { name: "Wall Slides", file: "images/b/bp3", sets: 2, reps: "10", notes: "No rib flare" },
          { name: "Child's Pose Reach", file: "images/b/bp4", sets: 2, reps: "30s", notes: "Reach long" },
          { name: "90/90 Hip Switch", file: "images/b/bp5", sets: 2, reps: "8", notes: "Move slow" },
          { name: "Couch Stretch", file: "images/b/bp6", sets: 2, reps: "30s/side", notes: "Glute squeezed" },
          { name: "Bird Dog", file: "images/b/bp7", sets: 2, reps: "8/side", notes: "No twisting" },
          { name: "Neck CARs", file: "images/b/bp8", sets: 2, reps: "5", notes: "Small smooth circles" }
        ]
      },
      {
        title: "C",
        workout: [
          { name: "Dumbbell Swing", file: "images/c/cw1", sets: 3, reps: "12", notes: "Hip hinge, not squat" },
          { name: "Squat to Press", file: "images/c/cw2", sets: 3, reps: "10", notes: "Smooth drive up" },
          { name: "TRX Fallout", file: "images/c/cw3", sets: 3, reps: "8", notes: "Abs locked" },
          { name: "Single-leg Squat Assist", file: "images/c/cw4", sets: 3, reps: "8/side", notes: "Use TRX lightly" },
          { name: "Sumo Squat", file: "images/c/cw5", sets: 3, reps: "10", notes: "Knees out" },
          { name: "TRX Face Pull", file: "images/c/cw6", sets: 3, reps: "12", notes: "Elbows high" },
          { name: "TRX Mountain Climber", file: "images/c/cw7", sets: 3, reps: "30s", notes: "Slow and sharp" },
          { name: "Tricep Dip", file: "images/c/cw8", sets: 3, reps: "8", notes: "Shoulders away from ears" }
        ],
        posture: [
          { name: "Open Book", file: "images/c/cp1", sets: 2, reps: "8/side", notes: "Rotate upper back" },
          { name: "Thread the Needle", file: "images/c/cp2", sets: 2, reps: "8/side", notes: "Breathe into stretch" },
          { name: "Prone Y Raise", file: "images/c/cp3", sets: 2, reps: "10", notes: "Thumbs up" },
          { name: "Prone W Raise", file: "images/c/cp4", sets: 2, reps: "10", notes: "Squeeze shoulder blades" },
          { name: "Hamstring Floss", file: "images/c/cp5", sets: 2, reps: "10/side", notes: "Gentle movement" },
          { name: "Ankle Rocks", file: "images/c/cp6", sets: 2, reps: "10/side", notes: "Heel stays down" },
          { name: "Side Plank", file: "images/c/cp7", sets: 2, reps: "20s/side", notes: "Straight line" },
          { name: "Breathing Reset", file: "images/c/cp8", sets: 1, reps: "2 min", notes: "Slow nasal breathing" }
        ]
      }
    ];

    let currentScreen = "home";
    let currentDay = 0;
    let currentMode = "workout";

    const homeScreen = document.getElementById("homeScreen");
    const workoutScreen = document.getElementById("workoutScreen");
    const grid = document.getElementById("grid");
    const dayMark = document.getElementById("dayMark");
    const modal = document.getElementById("modal");
    const modalMedia = document.getElementById("modalMedia");
    const modalTitle = document.getElementById("modalTitle");
    const modalMeta = document.getElementById("modalMeta");

    function showHome() {
      currentScreen = "home";
      modal.classList.remove("open");
      homeScreen.classList.remove("hidden");
      workoutScreen.classList.remove("active");
    }

    function chooseDay(dayIndex) {
      currentScreen = "workout";
      currentDay = dayIndex;
      currentMode = "workout";
      homeScreen.classList.add("hidden");
      workoutScreen.classList.add("active");
      renderWorkout();
    }

    function setMode(mode) {
      if (currentScreen !== "workout") return;
      currentMode = mode;
      renderWorkout();
    }

    function renderWorkout() {
      const day = WORKOUTS[currentDay];
      const exercises = day[currentMode];

      dayMark.textContent = day.title;

      document.querySelectorAll(".mode-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === currentMode);
      });

      grid.innerHTML = exercises.map((exercise, index) => {
        const src = `${exercise.file}.jpg`;
        return `
          <article class="exercise" data-index="${index}">
            <img src="${src}" alt="${html(exercise.name)}" loading="eager" onerror="tryImageExtension(this, '${exercise.file}', 0, ${index + 1})">
            <div class="caption">
              <span class="name">${html(exercise.name)}</span>
              <span class="meta">${html(formatDose(exercise))}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function tryImageExtension(img, fileBase, extensionIndex, fallbackNumber) {
      const nextIndex = extensionIndex + 1;

      if (nextIndex < EXTENSIONS.length) {
        img.onerror = function () {
          tryImageExtension(img, fileBase, nextIndex, fallbackNumber);
        };
        img.src = `${fileBase}.${EXTENSIONS[nextIndex]}`;
        return;
      }

      const fallback = document.createElement("div");
      fallback.className = "placeholder";
      fallback.textContent = fallbackNumber;
      img.replaceWith(fallback);
    }

    function formatDose(exercise) {
      if (!exercise.sets && !exercise.reps) return "";
      if (!exercise.sets) return exercise.reps;
      if (!exercise.reps) return `${exercise.sets} sets`;
      return `${exercise.sets}×${exercise.reps}`;
    }

    function applyWorkoutText(text) {
      const lines = text.split(/\r?\n/);

      lines.forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line || line.startsWith("#")) return;

        const parts = line.split(" / ").map((part) => part.trim());
        if (parts.length < 6) return;

        const mode = parts[0].toLowerCase().includes("posture") ? "posture" : "workout";
        const dayLetterMatch = parts[1].match(/[ABC]/i);
        if (!dayLetterMatch) return;

        const dayIndex = "abc".indexOf(dayLetterMatch[0].toLowerCase());
        const exerciseIndex = parseInt(parts[2], 10) - 1;
        const name = parts[3];

        if (!WORKOUTS[dayIndex] || !WORKOUTS[dayIndex][mode] || !WORKOUTS[dayIndex][mode][exerciseIndex]) return;

        const exercise = WORKOUTS[dayIndex][mode][exerciseIndex];
        exercise.name = name;

        parts.slice(4).forEach((field) => {
          const colonIndex = field.indexOf(":");
          if (colonIndex === -1) return;

          const key = field.slice(0, colonIndex).trim().toLowerCase();
          const value = field.slice(colonIndex + 1).trim();

          if (key === "sets") exercise.sets = isNaN(Number(value)) ? value : Number(value);
          if (key === "reps") exercise.reps = value;
          if (key === "notes") exercise.notes = value;
        });
      });

      if (currentScreen === "workout") renderWorkout();
    }

    async function loadWorkoutsTxt() {
      try {
        const response = await fetch(`workouts.txt?v=${Date.now()}`);
        if (!response.ok) return;
        const text = await response.text();
        applyWorkoutText(text);
      } catch (error) {
        console.log("Could not load workouts.txt", error);
      }
    }

    function openModal(exercise, fallbackNumber) {
      modalTitle.textContent = exercise.name;
      modalMeta.textContent = `${formatDose(exercise)}${exercise.notes ? " · " + exercise.notes : ""}`;
      modalMedia.innerHTML = `<img src="${exercise.file}.jpg" alt="${html(exercise.name)}" onerror="tryImageExtension(this, '${exercise.file}', 0, ${fallbackNumber})">`;
      modal.classList.add("open");
    }

    function html(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.querySelectorAll(".day-button").forEach((button) => {
      button.addEventListener("click", () => {
        chooseDay(Number(button.dataset.day));
      });
    });

    document.getElementById("homeButton").addEventListener("click", showHome);

    document.querySelectorAll(".mode-button").forEach((button) => {
      button.addEventListener("click", () => {
        setMode(button.dataset.mode);
      });
    });

    grid.addEventListener("click", (event) => {
      const card = event.target.closest(".exercise");
      if (!card) return;

      const exercise = WORKOUTS[currentDay][currentMode][Number(card.dataset.index)];
      openModal(exercise, Number(card.dataset.index) + 1);
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      modal.classList.remove("open");
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) modal.classList.remove("open");
    });

    let startX = 0;
    let startY = 0;
    let startTime = 0;

    document.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      startX = touch.clientX;
      startY = touch.clientY;
      startTime = Date.now();
    }, { passive: true });

    document.addEventListener("touchend", (event) => {
      if (currentScreen !== "workout") return;
      if (modal.classList.contains("open")) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      const elapsed = Date.now() - startTime;

      if (elapsed > 700) return;
      if (Math.abs(dx) < 46) return;
      if (Math.abs(dx) < Math.abs(dy)) return;

      if (dx < 0) setMode("posture");
      else setMode("workout");
    }, { passive: true });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") modal.classList.remove("open");
      if (event.key === "Home") showHome();
      if (currentScreen !== "workout") return;
      if (event.key === "ArrowRight") setMode("posture");
      if (event.key === "ArrowLeft") setMode("workout");
    });

    showHome();
    loadWorkoutsTxt();
  </script>
</body>
</html>
